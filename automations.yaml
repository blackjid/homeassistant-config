- id: '1788019998963'
  alias: Ruby poop show notification Living Display
  description: Mirrors sensor.ruby_poop_status onto the Pixel Display, using indicator
    2 so it reads distinctly from the food reminder on indicator 1. Pending duty is
    a pushed app; completion is a one-shot notification. The right button on the device
    clears it - see the 'Ruby Poop Duty Done' automation. Resyncs on HA start.
  triggers:
  - trigger: state
    entity_id:
    - sensor.ruby_poop_status
    id: changed
  - trigger: homeassistant
    event: start
    id: sync
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: sync
    - condition: template
      value_template: '{{ trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.ruby_poop_status
        state: Yard is clean
      sequence:
      - if:
        - condition: trigger
          id: changed
        then:
        - action: mqtt.publish
          data:
            evaluate_payload: false
            qos: 0
            retain: false
            topic: awtrixLiving/cmd/notify
            payload: '{"text": "Thanks {{ states(''sensor.ruby_poop_turn'') }}! Yard
              is clean", "icon": "poop", "durationMs": 15000, "stack": false, "textColor":
              "palette", "palette": "Rainbow"}'
      - action: mqtt.publish
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: awtrixLiving/cmd/apps/pushed/rubypoop
          payload: ''
      - action: mqtt.publish
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: awtrixLiving/cmd/indicators/2
          payload: ''
    default:
    - action: mqtt.publish
      data:
        evaluate_payload: false
        qos: 0
        retain: false
        topic: awtrixLiving/cmd/apps/pushed/rubypoop
        payload: '{"text": "{{ states(''sensor.ruby_poop_status'') }}", "icon": "poop",
          "durationMs": 10000, "textColor": "{% if ''overdue'' in states(''sensor.ruby_poop_status'')
          %}#FF3333{% else %}#E8A33D{% endif %}"}'
    - action: mqtt.publish
      data:
        evaluate_payload: false
        qos: 0
        retain: false
        topic: awtrixLiving/cmd/indicators/2
        payload: '{% if ''overdue'' in states(''sensor.ruby_poop_status'') %}{"color":
          "#FF3333", "blinkMs": 500}{% else %}{"color": "#E8A33D", "blinkMs": 0}{%
          endif %}'
  mode: restart
- id: '1788021000646'
  alias: Rotate Ruby Care Turn
  description: 'Advances input_select.ruby_care_turn at each half-month boundary:
    days 1-15 are one kid, day 16 to month end the next. The marker input_text records
    which period has already been rotated for, so a restart, a config reload, or several
    triggers in the same period cannot double-advance the turn. On the very first
    run the marker is empty, so it only seeds the marker and leaves the current turn
    alone.'
  triggers:
  - trigger: time
    at: 00:00:30
  - trigger: homeassistant
    event: start
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.ruby_care_period'') not in [''unknown'', ''unavailable'']
      and states(''sensor.ruby_care_period'') != states(''input_text.ruby_last_rotated_period'')
      }}'
  actions:
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: input_text.ruby_last_rotated_period
        state:
        - ''
        - unknown
        - unavailable
    then:
    - action: input_select.select_next
      target:
        entity_id: input_select.ruby_care_turn
      data:
        cycle: true
  - action: input_text.set_value
    target:
      entity_id: input_text.ruby_last_rotated_period
    data:
      value: '{{ states(''sensor.ruby_care_period'') }}'
  mode: single
- id: '1788021043773'
  alias: Update Ruby Last Fed Time
  description: Stamps the feeding time when the food container lid opens. The care
    turn is NOT advanced here - it rotates on a half-month schedule instead, see 'Rotate
    Ruby Care Turn'.
  triggers:
  - trigger: state
    entity_id: binary_sensor.ruby_food_lid
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.ruby_last_fed
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: '1788022361908'
  alias: Ruby Acknowledge Chore From Display
  description: 'The centre (select) button on the Pixel Display marks the chore currently
    on screen as done: on the food app it stamps last-fed, on the poop app it stamps
    last-pickup. It acts only while one of those two apps is the app on screen, so
    the button keeps its normal behaviour the rest of the time. For feeding this is
    a fallback - the food container lid sensor does not always fire - so the same
    helper can be written by either path.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.living_room_pixel_display_button_select
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.living_room_pixel_display_current_app
        state: rubyfood
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ruby_last_fed
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: state
        entity_id: sensor.living_room_pixel_display_current_app
        state: rubypoop
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ruby_last_poop_pickup
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: '1788024475270'
  alias: Ruby Voice Reminder On Face Match
  description: 'When the living room camera recognises the kid whose care turn it
    currently is, and a chore is actually outstanding, speak a personalised reminder
    on the living room speaker and force the matching app onto the Pixel Display.


    Two independent limits, because they do different jobs. The counter caps announcements
    at two per feeding period (refilled 06:00 and 13:00 by ''Reset Ruby Voice Announcement
    Quota''). The 30 minute timer spaces them out - without it both allowed announcements
    would fire within seconds of each other, since the face sensor flaps between names
    every few hundred ms whenever several people are in frame, and the whole quota
    would be spent on one gathering.


    Speaks on media_player.living_room_voice_2 (Google Home Mini), NOT living_room_speaker.
    The latter is a Chromecast Audio with no speaker of its own: it accepts the stream
    and reports playing even when the Marantz it feeds is powered off, which is silent
    failure with no error anywhere. The Mini is self-powered and always awake.


    Speaks via ElevenLabs. Note the shape: tts.speak TARGETS the tts entity and takes
    the speaker as media_player_entity_id in data, unlike the legacy *_say services
    which target the speaker directly. Voice and model come from the integration''s
    own options, so changing the household voice in the UI changes this announcement
    too. To give Ruby reminders their own voice without affecting anything else, add
    an options.voice key with a voice id to this action.


    The voice is chosen per kid via the voice_id variable, overriding the integration
    default for this announcement only. Names not in that map fall back to the household
    default voice rather than erroring, so an unmapped or renamed rota entry still
    speaks.


    PER-KID VOICE MAP IS EMPTY ON PURPOSE. ElevenLabs rejects LIBRARY voices on a
    free plan with HTTP 402 paid_plan_required, and the failure is silent from Home
    Assistant''s side: the service call returns success and only the log shows the
    error. Only premade voices work on the free tier. Do not add a voice id to this
    map without first confirming it actually produces audio.


    spoken_name exists so the accented form reaches the speech engine WITHOUT changing
    the rota value. The input_select option must stay ''Ines'' unaccented because
    that is the string the face recogniser emits, and the trigger compares the two
    directly - accenting the helper would silently stop the automation ever matching
    her.'
  triggers:
  - trigger: state
    entity_id: sensor.living_room_living_room_last_recognized_face
    not_to:
    - None
    - Unknown
    - unknown
    - unavailable
    note: 'Frigate''s native per-camera sensor has NO attributes - no last_seen, no
      score - so this triggers on the state itself. Safe because the sensor is not
      sticky: the integration resets it to the literal None 60s after the last face
      message, so a repeat visit is a real state change. Unknown means an unrecognised
      face. No confidence threshold is available here.'
  conditions:
  - condition: numeric_state
    entity_id: counter.ruby_voice_announcements_this_period
    below: 2
  - condition: state
    entity_id: timer.ruby_voice_reminder_cooldown
    state: idle
  - condition: time
    after: 07:00:00
    before: '21:00:00'
  - condition: template
    value_template: '{{ states(''sensor.living_room_living_room_last_recognized_face'')
      == states(''input_select.ruby_care_turn'') }}'
    note: Stays a template because it compares two entity states to each other, which
      no native condition does.
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: sensor.ruby_feeding_status
        state: Ruby was fed
    - condition: not
      conditions:
      - condition: state
        entity_id: sensor.ruby_poop_status
        state: Yard is clean
  actions:
  - action: counter.increment
    target:
      entity_id: counter.ruby_voice_announcements_this_period
  - action: timer.start
    target:
      entity_id: timer.ruby_voice_reminder_cooldown
  - action: mqtt.publish
    data:
      evaluate_payload: false
      qos: 0
      retain: false
      topic: awtrixLiving/cmd/apps/switch
      payload: '{"name": "{{ ''rubyfood'' if food_pending else ''rubypoop'' }}", "fast":
        true}'
  - action: tts.speak
    target:
      entity_id: tts.elevenlabs_text_to_speech
    data:
      media_player_entity_id: media_player.living_room_voice_2
      message: '{% if food_pending and poop_pending %}{{ spoken_name }}! It is your
        turn with Ruby. She still needs feeding, and the backyard needs picking up.{%
        elif food_pending %}{{ spoken_name }}! It is your turn. Ruby has not been
        fed yet.{% else %}{{ spoken_name }}! It is your turn. The backyard still needs
        picking up.{% endif %}'
      options:
        voice: '{{ voice_id }}'
  mode: single
  variables:
    who: '{{ states(''input_select.ruby_care_turn'') }}'
    food_pending: '{{ states(''sensor.ruby_feeding_status'') != ''Ruby was fed'' }}'
    poop_pending: '{{ states(''sensor.ruby_poop_status'') != ''Yard is clean'' }}'
    voice_id: '{% set w = states(''input_select.ruby_care_turn'') %}{% set voices
      = {''Ines'': ''cgSgspJ2msm6clMCkdW9'', ''Pili'': ''pFZP5JQG7iQjIQuC4Bku'', ''Lucas'':
      ''TX3LPaxmHKxFdv7VOQHJ''} %}{{ voices.get(w, ''EXAVITQu4vr4xnSDxMaL'') }}'
    spoken_name: '{% set w = states(''input_select.ruby_care_turn'') %}{% set names
      = {''Ines'': ''Inés''} %}{{ names.get(w, w) }}'
- id: '1788024600966'
  alias: Reset Ruby Voice Announcement Quota
  description: 'Refills the spoken-reminder quota at the start of each feeding period
    - 06:00 for the morning, 13:00 for the evening - so at most two announcements
    happen per half-day. Deliberately has no Home Assistant start trigger: a restart
    must not refill the quota, because the failure mode of a missed reset is under-announcing,
    which is harmless, while over-announcing is not.'
  triggers:
  - trigger: time
    at: 06:00:00
  - trigger: time
    at: '13:00:00'
  conditions: []
  actions:
  - action: counter.reset
    target:
      entity_id: counter.ruby_voice_announcements_this_period
  mode: single
