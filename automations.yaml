- id: '1770952525587'
  alias: Turn on light and end Movie night when TV off
  description: 'When the living room TV goes off after dark and Movie night is still
    on, clear the Movie night flag and bring the living room light back up.


    Both original triggers were dead device triggers and the automation would not
    load at all: one pointed at device 8cc47a77 (gone from the device registry), the
    other at a switch entity of the SmartThings TV that no longer exists - SmartThings
    maps TVs to media_player only now.'
  triggers:
  - trigger: media_player.turned_off
    target:
      entity_id: media_player.55_oled
    note: 'Purpose-specific trigger on the SmartThings TV entity, not a device trigger
      - device ids do not survive a device being re-added, which is exactly how this
      automation died. No dwell time: the old 1s debounce came from a Z-Wave relay,
      and this entity is cloud-polled so a sub-second window means nothing.'
  conditions:
  - condition: sun
    after: sunset
    before: sunrise
  - condition: state
    entity_id: input_boolean.movie_night
    state:
    - 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.movie_night
  - action: light.turn_on
    target:
      entity_id: light.living_room
  mode: single
- id: '1770954468322'
  alias: test cafe
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - button.synchronize_devices
  actions:
  - variables:
      current_node: condition_1770954304277_1
      flow_context: {}
  - alias: State Machine Loop
    repeat:
      until: '{{ current_node == "END" }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ current_node == "condition_1770954304277_1" }}'
          sequence:
          - variables:
              current_node: '{% if is_state(''conversation.home_assistant'', ''on'')
                %}action_1770954348422_5{% else %}action_1770954471561_8{% endif %}'
        - conditions:
          - condition: template
            value_template: '{{ current_node == "action_1770954348422_5" }}'
          sequence:
          - action: light.turn_on
          - variables:
              current_node: action_1770954484384_9
        - conditions:
          - condition: template
            value_template: '{{ current_node == "action_1770954471561_8" }}'
          sequence:
          - action: light.turn_on
          - variables:
              current_node: action_1770954484384_9
        - conditions:
          - condition: template
            value_template: '{{ current_node == "action_1770954484384_9" }}'
          sequence:
          - action: light.turn_on
          - variables:
              current_node: END
        default:
        - data:
            message: 'C.A.F.E.: Unknown state "{{ current_node }}", ending flow'
            level: warning
          action: system_log.write
        - variables:
            current_node: END
  mode: single
  variables:
    _cafe_metadata:
      version: 1
      strategy: native
      nodes:
        trigger_1770954299619_0:
          x: -30
          y: -150
        condition_1770954304277_1:
          x: 240
          y: -150
        action_1770954348422_5:
          x: 555
          y: -240
        action_1770954471561_8:
          x: 570
          y: -45
        action_1770954484384_9:
          x: 885
          y: -100
      graph_id: bd0ea486-1b44-4f0a-8fdc-1d496a07da1a
      graph_version: 1
