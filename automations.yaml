- id: '1721780876782'
  alias: 'Entrance: Car lights at night'
  description: Turn on garage lights when someone or a car is spotted and it is already
    dark outside
  triggers:
  - trigger: motion.detected
    target:
      entity_id:
      - binary_sensor.entrance_vehicle
      - binary_sensor.entrance_person
    id: car_lights
    note: 'Was two device triggers on device f64ea065, which no longer exists in the
      device registry - the Frigate camera device was re-added at some point and device
      ids do not survive that. Both binary_sensors are device_class motion, so motion.detected
      is the native fit. Targets the two entities explicitly rather than area_id entrance:
      that area also holds dog/cat/person occupancy sensors, and an area target would
      light the garage for the dog.'
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  actions:
  - action: light.turn_on
    target:
      area_id: entrance
  mode: single
- id: '1728669307584'
  alias: Ruby food show notification Living Display
  description: Mirrors sensor.ruby_feeding_status onto the Pixel Display. A pending
    feeding is a pushed app (persistent, occupies a loop slot because it needs attention);
    a completed feeding is a one-shot notification. Also resyncs on HA start so a
    stale 'starving' app cannot stick on the device, which keeps its own RAM-only
    app list.
  triggers:
  - trigger: state
    entity_id:
    - sensor.ruby_feeding_status
    id: changed
  - trigger: homeassistant
    event: start
    id: sync
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: sync
    - condition: template
      value_template: '{{ trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.ruby_feeding_status
        state: Ruby was fed
      sequence:
      - if:
        - condition: trigger
          id: changed
        then:
        - action: mqtt.publish
          data:
            evaluate_payload: false
            qos: 0
            retain: false
            topic: awtrixLiving/cmd/notify
            payload: '{"text": "Thanks {{ states(''input_select.ruby_care_turn'')
              }}!! Ruby will be happy!", "icon": "76", "durationMs": 30000, "stack":
              false, "textColor": "palette", "palette": "Rainbow"}'
      - action: mqtt.publish
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: awtrixLiving/cmd/apps/pushed/rubyfood
          payload: ''
      - action: mqtt.publish
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: awtrixLiving/cmd/indicators/1
          payload: ''
    default:
    - action: mqtt.publish
      data:
        evaluate_payload: false
        qos: 0
        retain: false
        topic: awtrixLiving/cmd/apps/pushed/rubyfood
        payload: '{"text": "{{ states(''sensor.ruby_feeding_status'') }}", "icon":
          "5242", "durationMs": 10000, "textColor": "{% if ''starving'' in states(''sensor.ruby_feeding_status'')
          %}#FF3333{% else %}#FFA500{% endif %}"}'
    - action: mqtt.publish
      data:
        evaluate_payload: false
        qos: 0
        retain: false
        topic: awtrixLiving/cmd/indicators/1
        payload: '{% if ''starving'' in states(''sensor.ruby_feeding_status'') %}{"color":
          "#FF0000", "blinkMs": 500}{% else %}{"color": "#FFA500", "blinkMs": 0}{%
          endif %}'
  mode: restart
