- id: '1770584339374'
  alias: Living Room | Manage Bias Lights
  description: Keeps the Bias light synced with the living room TV state after dark.
    Replaces the stale 55_oled dependency, reacts to sunset/sunrise, and avoids redundant
    on/off calls.
  triggers:
  - trigger: state
    entity_id:
    - switch.living_room_main_tv
  - trigger: state
    entity_id:
    - media_player.android_tv_192_168_20_164
  - trigger: sun
    event: sunset
    offset: 0
  - trigger: sun
    event: sunrise
    offset: 0
  conditions: []
  actions:
  - variables:
      is_dark: '{{ is_state(''sun.sun'', ''below_horizon'') }}'
      tv_power_on: '{{ is_state(''switch.living_room_main_tv'', ''on'') }}'
      shield_active: '{{ states(''media_player.android_tv_192_168_20_164'') not in
        [''off'', ''unavailable'', ''unknown''] }}'
      should_bias_be_on: '{{ is_dark and (tv_power_on or shield_active) }}'
      bias_is_on: '{{ is_state(''light.bias'', ''on'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ should_bias_be_on and not bias_is_on }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bias
        data:
          transition: 2
          brightness_pct: 30
          color_temp_kelvin: 4700
    - conditions:
      - condition: template
        value_template: '{{ (not should_bias_be_on) and bias_is_on }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bias
        data:
          transition: 4
    default: []
  mode: restart
