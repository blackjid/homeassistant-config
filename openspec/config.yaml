schema: spec-driven

context: |
  This repository is a Home Assistant configuration, not an application codebase.
  "Implementation" means entities, helpers and automations, not source files.

  Where things live:
  - Automations and UI-managed helpers live in Home Assistant's own storage and are
    edited through its UI or config API. They are deliberately NOT version controlled,
    because the household needs to review and adjust them in the UI.
  - A small amount of YAML remains under packages/ for things the UI cannot express,
    notably template sensors that expose custom attributes.
  - Specs here are therefore the durable record. The running config is the source of
    truth for behaviour; these specs are the source of truth for intent.

  Each capability spec carries a "Why It Is Built This Way" section between Purpose and
  Requirements. It holds the failure modes and the reasoning behind non-obvious choices.
  Read it before changing a capability - several requirements look wrong, or look like
  they could be simplified, until you know what went wrong first. When a change alters
  the reasoning and not just the behaviour, update that section too.

  Two recurring hazards in this house, both of which look like success from inside
  Home Assistant:
  - A playback target can report "playing" while producing no sound, if it depends on
    separate powered equipment.
  - A speech request can be rejected after the service call has already returned
    success, leaving the failure only in the log.
  Never treat a successful service call as evidence that something was seen or heard.

rules:
  specs:
    - Requirements describe observable household behaviour, never entity ids or
      automation structure.
    - Anything a family member cannot observe belongs under "Why It Is Built This Way",
      not in a requirement.

