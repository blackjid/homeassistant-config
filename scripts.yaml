find_remote:
  sequence:
  - action: androidtv.adb_command
    metadata: {}
    target:
      entity_id: media_player.android_tv_192_168_20_164
    data:
      command: am start -a android.intent.action.VIEW -d -n com.nvidia.remotelocator/.ShieldRemoteLocatorActivity
  alias: Find Remote
  description: Script to trigger the location beep on the Nvidia Shield remote
  icon: mdi:remote-tv
